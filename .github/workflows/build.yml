name: Build Pause

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "browser-extension/**"
      - "mac/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - name: Collect
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/Pause.apk
          (cd browser-extension && zip -r ../dist/Pause-browser-extension.zip . -x ".*")
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*

  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build Pause.app
        run: ./mac/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: mac/build/Pause-mac.zip

  release:
    needs: [android, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Pause build ${{ github.run_number }}
          make_latest: "true"
          body: |
            **Android:** open https://github.com/${{ github.repository }}/releases/latest/download/Pause.apk on your phone and install it.

            **Mac app:** download `Pause-mac.zip`, unzip, drag Pause to Applications. First open: right-click → Open (or System Settings → Privacy & Security → Open Anyway).

            **Browser extension:** unzip `Pause-browser-extension.zip`, open `chrome://extensions`, turn on Developer mode, click **Load unpacked**.
          files: |
            dist/Pause.apk
            dist/Pause-mac.zip
            dist/Pause-browser-extension.zip
