name: Build Pause

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "browser-extension/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Collect files
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/Pause.apk
          (cd browser-extension && zip -r ../dist/Pause-browser-extension.zip . -x ".*")

      - uses: actions/upload-artifact@v4
        with:
          name: pause-build
          path: dist/*

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Pause build ${{ github.run_number }}
          make_latest: "true"
          body: |
            **Android:** download `Pause.apk` on your phone and open it to install.
            Direct link to the newest build: https://github.com/${{ github.repository }}/releases/latest/download/Pause.apk

            **Mac (Chrome, Edge, Brave, Arc):** unzip `Pause-browser-extension.zip`, open `chrome://extensions`, turn on Developer mode, click **Load unpacked**, and pick the unzipped folder.
          files: |
            dist/Pause.apk
            dist/Pause-browser-extension.zip
