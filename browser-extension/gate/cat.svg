<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b2a7a"/><stop offset=".5" stop-color="#7c6ff0"/><stop offset="1" stop-color="#f3a6c8"/>
    </linearGradient>
    <radialGradient id="fur" cx=".4" cy=".35" r=".75">
      <stop offset="0" stop-color="#ffd29a"/><stop offset=".6" stop-color="#ff9d4d"/><stop offset="1" stop-color="#e2702a"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="640" height="400" fill="url(#sky)"/>
  <g filter="url(#soft)" opacity=".7">
    <ellipse cx="120" cy="320" rx="180" ry="60" fill="#c9c2ff"/>
    <ellipse cx="520" cy="80" rx="160" ry="50" fill="#ffd9bd"/>
    <ellipse cx="560" cy="350" rx="150" ry="55" fill="#b8ecdc"/>
    <ellipse cx="90" cy="70" rx="110" ry="40" fill="#f6b8d8"/>
  </g>
  <g fill="#fff">
    <circle cx="70" cy="140" r="2.5"/><circle cx="160" cy="60" r="2"/><circle cx="250" cy="110" r="1.6"/>
    <circle cx="420" cy="50" r="2.4"/><circle cx="560" cy="170" r="2"/><circle cx="600" cy="260" r="1.6"/>
    <circle cx="40" cy="250" r="1.8"/><circle cx="470" cy="300" r="2.2"/><circle cx="200" cy="350" r="1.6"/>
    <path d="M520 220 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" opacity=".9"/>
    <path d="M110 190 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" opacity=".8"/>
  </g>
  <!-- planet -->
  <circle cx="545" cy="120" r="26" fill="#ffd166" opacity=".9"/>
  <ellipse cx="545" cy="120" rx="44" ry="10" fill="none" stroke="#fff" stroke-width="4" opacity=".7" transform="rotate(-18 545 120)"/>
  <!-- cat body -->
  <g transform="translate(320 215) rotate(-8)">
    <ellipse cx="0" cy="95" rx="92" ry="62" fill="url(#fur)"/>
    <path d="M80 110 q70 -10 60 -70 q-5 -22 -20 -10 q10 40 -45 55z" fill="#ff9d4d"/>
    <ellipse cx="-45" cy="150" rx="22" ry="14" fill="#ffd29a"/>
    <ellipse cx="40" cy="152" rx="22" ry="14" fill="#ffd29a"/>
    <!-- head -->
    <path d="M-78 -40 L-62 -112 L-22 -66 Z" fill="#ff9d4d"/>
    <path d="M78 -40 L62 -112 L22 -66 Z" fill="#ff9d4d"/>
    <path d="M-66 -52 L-58 -96 L-34 -66 Z" fill="#ffb3c7"/>
    <path d="M66 -52 L58 -96 L34 -66 Z" fill="#ffb3c7"/>
    <ellipse cx="0" cy="-10" rx="96" ry="80" fill="url(#fur)"/>
    <path d="M-30 -86 q8 18 0 32 M0 -90 q6 20 0 36 M30 -86 q-8 18 0 32" stroke="#e2702a" stroke-width="7" fill="none" stroke-linecap="round" opacity=".55"/>
    <!-- headphones -->
    <path d="M-92 -10 q0 -110 92 -110 q92 0 92 110" stroke="#2b2650" stroke-width="12" fill="none" stroke-linecap="round"/>
    <rect x="-112" y="-30" width="34" height="56" rx="16" fill="#2b2650"/>
    <rect x="78" y="-30" width="34" height="56" rx="16" fill="#2b2650"/>
    <rect x="-106" y="-22" width="12" height="40" rx="6" fill="#5ed3b3"/>
    <rect x="94" y="-22" width="12" height="40" rx="6" fill="#5ed3b3"/>
    <!-- happy closed eyes -->
    <path d="M-50 -12 q16 -18 32 0" stroke="#3a2416" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M18 -12 q16 -18 32 0" stroke="#3a2416" stroke-width="7" fill="none" stroke-linecap="round"/>
    <ellipse cx="-52" cy="18" rx="14" ry="8" fill="#ff7aa8" opacity=".55"/>
    <ellipse cx="52" cy="18" rx="14" ry="8" fill="#ff7aa8" opacity=".55"/>
    <path d="M-8 8 h16 l-8 9z" fill="#c2456c"/>
    <path d="M0 17 q-10 16 -22 8 M0 17 q10 16 22 8" stroke="#3a2416" stroke-width="5" fill="none" stroke-linecap="round"/>
    <g stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".85">
      <path d="M-40 18 l-48 -6 M-40 26 l-46 8"/><path d="M40 18 l48 -6 M40 26 l46 8"/>
    </g>
  </g>
  <!-- music notes -->
  <g fill="#fff" opacity=".9">
    <path d="M440 170 v-36 l22 -6 v34" stroke="#fff" stroke-width="4" fill="none"/>
    <circle cx="434" cy="172" r="8"/><circle cx="456" cy="164" r="8"/>
    <path d="M190 150 v-30" stroke="#fff" stroke-width="4"/><circle cx="184" cy="152" r="8"/>
  </g>
</svg>
